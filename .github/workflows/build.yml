name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RUST_TOOLCHAIN: nightly-2026-04-16
      HMCL_VERSION: 3.13.1
    steps:
      - uses: actions/checkout@v6
      - name: Get short SHA
        shell: pwsh
        run: echo "SHORT_SHA=$("${{ github.sha }}".Substring(0, 7))" >> $env:GITHUB_ENV
      - name: Setup Rust
        shell: pwsh
        run: rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rust-src
      - name: Build HMCLauncher
        shell: pwsh
        run: |
          cargo build --release --locked
          Move-Item -Path "target\i686-win7-windows-msvc\release\HMCLauncher.exe" -Destination "target\HMCLauncher-$env:SHORT_SHA-unsigned.exe"
      - name: Upload Unsigned HMCLauncher exe
        id: upload-hmclauncher-unsigned
        uses: actions/upload-artifact@v7
        with:
          path: target\HMCLauncher-${{ env.SHORT_SHA }}-unsigned.exe
          archive: false
      - name: Sign HMCLauncher exe
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: 'test-signing'
          github-artifact-id: '${{ steps.upload-hmclauncher-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: target\signed
      - name: Download HMCLauncher exe
        shell: pwsh
        run: |
          Move-Item -Path "target\signed\HMCLauncher-$env:SHORT_SHA-unsigned.exe" -Destination "target\HMCLauncher-$env:SHORT_SHA.exe"
      - name: Upload HMCLauncher exe
        uses: actions/upload-artifact@v7
        with:
          path: target\HMCLauncher-${{ env.SHORT_SHA }}.exe
          archive: false
      - name: Download HMCL jar
        shell: pwsh
        run: |
          $jarFileName = "HMCL-$env:HMCL_VERSION.jar"
          $downloadUrl = "https://github.com/HMCL-dev/HMCL/releases/download/v$env:HMCL_VERSION/$jarFileName"
          
          Invoke-WebRequest -Uri $downloadUrl -OutFile "target\$jarFileName"
      - name: Create HMCL exe
        shell: pwsh
        run: |          
          $exeBytes = [System.IO.File]::ReadAllBytes("target\HMCLauncher-$env:SHORT_SHA.exe")
          $jarBytes = [System.IO.File]::ReadAllBytes("target\HMCL-$env:HMCL_VERSION.jar")
          
          $mergedBytes = $exeBytes + $jarBytes
          
          [System.IO.File]::WriteAllBytes("target\HMCL-$env:HMCL_VERSION.$env:SHORT_SHA.exe", $mergedBytes)
      - name: Upload HMCL exe
        uses: actions/upload-artifact@v7
        with:
          name: HMCL.exe
          path: target\HMCL-${{ env.HMCL_VERSION }}.${{ env.SHORT_SHA }}.exe
          archive: false
      - name: Create release
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG "target\HMCLauncher-$env:SHORT_SHA.exe" --verify-tag
